<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9e4a"/>
      <stop offset="100%" stop-color="#2d6e20"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" fill="url(#bg)" rx="28"/>
  <!-- Grid overlay -->
  <g opacity="0.08">
    <line x1="0" y1="45" x2="180" y2="45" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="135" x2="180" y2="135" stroke="#000" stroke-width="1"/>
    <line x1="45" y1="0" x2="45" y2="180" stroke="#000" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="180" stroke="#000" stroke-width="1"/>
    <line x1="135" y1="0" x2="135" y2="180" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Character centered at ~90,90, pixel size = 9px -->
  <g transform="translate(27, 9)">
    <!-- Hair -->
    <rect x="27" y="9" width="72" height="9" fill="#6b3a1f"/>
    <rect x="18" y="18" width="90" height="9" fill="#5a3018"/>

    <!-- Face -->
    <rect x="27" y="27" width="72" height="27" fill="#d4a840"/>
    <rect x="18" y="27" width="9" height="18" fill="#6b3a1f"/>
    <!-- Eyes -->
    <rect x="36" y="36" width="18" height="9" fill="#22d3ee"/>
    <rect x="72" y="36" width="18" height="9" fill="#22d3ee"/>
    <!-- Mouth -->
    <rect x="54" y="45" width="18" height="9" fill="#96703a"/>

    <!-- Torso row 1: dark -->
    <rect x="27" y="54" width="72" height="9" fill="#110828"/>
    <!-- Torso row 2: purple stripe -->
    <rect x="27" y="63" width="72" height="9" fill="#7c3aed"/>
    <!-- Torso row 3: dark -->
    <rect x="27" y="72" width="72" height="9" fill="#110828"/>
    <!-- Torso row 4: purple stripe -->
    <rect x="27" y="81" width="72" height="9" fill="#7c3aed"/>

    <!-- Arms (dark) -->
    <rect x="18" y="54" width="9" height="27" fill="#110828"/>
    <rect x="99" y="54" width="9" height="27" fill="#110828"/>
    <!-- Hands (skin) -->
    <rect x="18" y="81" width="9" height="9" fill="#d4a840"/>
    <rect x="99" y="81" width="9" height="9" fill="#d4a840"/>

    <!-- Lower robe -->
    <rect x="36" y="90" width="54" height="18" fill="#0d0520"/>

    <!-- Boot trim -->
    <rect x="36" y="108" width="18" height="9" fill="#e8c0b8"/>
    <rect x="72" y="108" width="18" height="9" fill="#e8c0b8"/>

    <!-- Boots -->
    <rect x="36" y="117" width="18" height="9" fill="#a0622d"/>
    <rect x="72" y="117" width="18" height="9" fill="#a0622d"/>

    <!-- Sword (gold) -->
    <rect x="108" y="36" width="9" height="9" fill="#f5c842"/>
    <rect x="108" y="45" width="9" height="36" fill="#fbbf24"/>
    <!-- Sword handle -->
    <rect x="99" y="81" width="27" height="9" fill="#a0622d"/>
  </g>

  <!-- Title text at bottom -->
  <text x="90" y="158" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#fff" opacity="0.9">
    <tspan>SOTARO 99</tspan>
  </text>
</svg>
