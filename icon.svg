<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="512" height="512" shape-rendering="crispEdges">
  <!-- Background: dark green with border -->
  <rect width="16" height="16" fill="#2d5a27" rx="2"/>
  <rect x="1" y="1" width="14" height="14" fill="#3d7a32" rx="1"/>

  <!-- Hair (brown, row 1-2) -->
  <rect x="4" y="1" width="8" height="1" fill="#6b3a1f"/>
  <rect x="3" y="2" width="10" height="1" fill="#5a3018"/>

  <!-- Face / Head (golden skin, row 3-5) -->
  <rect x="4" y="3" width="8" height="3" fill="#d4a840"/>
  <!-- Hair side fringe -->
  <rect x="3" y="3" width="1" height="2" fill="#6b3a1f"/>
  <!-- Eyes (cyan) -->
  <rect x="5" y="4" width="2" height="1" fill="#22d3ee"/>
  <rect x="9" y="4" width="2" height="1" fill="#22d3ee"/>
  <!-- Mouth -->
  <rect x="7" y="5" width="2" height="1" fill="#96703a"/>

  <!-- Torso: purple stripe robe (row 6-9) -->
  <rect x="4" y="6" width="8" height="1" fill="#110828"/>
  <rect x="4" y="7" width="8" height="1" fill="#7c3aed"/>
  <rect x="4" y="8" width="8" height="1" fill="#110828"/>
  <rect x="4" y="9" width="8" height="1" fill="#7c3aed"/>

  <!-- Arms (dark robe + skin hands) -->
  <rect x="3" y="6" width="1" height="3" fill="#110828"/>
  <rect x="12" y="6" width="1" height="3" fill="#110828"/>
  <rect x="3" y="9" width="1" height="1" fill="#d4a840"/>
  <rect x="12" y="9" width="1" height="1" fill="#d4a840"/>

  <!-- Lower robe (row 10-11) -->
  <rect x="5" y="10" width="6" height="2" fill="#0d0520"/>

  <!-- Boot trim (pink-white) -->
  <rect x="5" y="12" width="2" height="1" fill="#e8c0b8"/>
  <rect x="9" y="12" width="2" height="1" fill="#e8c0b8"/>

  <!-- Boots (orange-brown) -->
  <rect x="5" y="13" width="2" height="1" fill="#a0622d"/>
  <rect x="9" y="13" width="2" height="1" fill="#a0622d"/>

  <!-- Weapon glow (small sword on right) -->
  <rect x="13" y="5" width="1" height="4" fill="#fbbf24"/>
  <rect x="13" y="4" width="1" height="1" fill="#f5c842"/>
</svg>
