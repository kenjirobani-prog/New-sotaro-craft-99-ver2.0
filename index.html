<!DOCTYPE html>
<!-- v2.1 - Stage compression update -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>湊太郎クラフト 九九</title>
  <!-- App name & theme for "Add to Home Screen" -->
  <meta name="application-name" content="湊太郎クラフト 九九">
  <meta name="apple-mobile-web-app-title" content="湊太郎クラフト 九九">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3d7a32">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Start Screen ===== -->
  <div id="start-screen" class="screen center-screen">
    <div class="title-block">
      <h1 class="game-title">Sotaro<br>craft 99</h1>
      <p class="subtitle">- 九九の戦い -</p>
    </div>
    <!-- Mode Selection -->
    <div class="mode-select">
      <button id="mode-battle" class="mode-btn selected">
        <span class="mode-icon">⚔️</span>
        <span class="mode-label">バトル</span>
      </button>
      <button id="mode-mining" class="mode-btn">
        <span class="mode-icon">⛏️</span>
        <span class="mode-label">採掘</span>
      </button>
    </div>
    <button id="start-btn" class="block-btn big-btn">START</button>
    <!-- Score History -->
    <div id="score-history" class="score-history"></div>
  </div>

  <!-- ===== Game Screen ===== -->
  <div id="game-screen" class="screen game-layout hidden">
    <!-- Title Bar -->
    <div id="title-bar">
      <span class="title-text">Sotaro craft 99</span>
      <div class="sound-controls">
        <button id="bgm-toggle" class="icon-btn" title="BGM ON/OFF">&#9835;</button>
        <input type="range" id="volume-slider" min="0" max="100" value="50" title="Volume">
        <button id="title-btn" class="icon-btn" title="タイトルに戻る">&#9664;</button>
      </div>
    </div>

    <!-- Battle Area -->
    <div id="battle-area">
      <!-- Player Side -->
      <div class="fighter-col">
        <div class="hp-bar-container">
          <div id="player-hp-bar" class="hp-bar player-bar"></div>
        </div>
        <span id="player-hp-text" class="hp-text">100/100</span>
        <div id="player-char" class="character player-character">
          <div class="mc-head">
            <div class="mc-eye left-eye"></div>
            <div class="mc-eye right-eye"></div>
            <div class="mc-mouth"></div>
          </div>
          <div class="mc-body">
            <div class="mc-arm left-arm"></div>
            <div class="mc-torso"></div>
            <div class="mc-arm right-arm"></div>
          </div>
          <div class="mc-legs">
            <div class="mc-leg left-leg"></div>
            <div class="mc-leg right-leg"></div>
          </div>
        </div>
        <span class="fighter-label">SOTARO</span>
        <span id="weapon-display" class="weapon-label">✊ こぶし</span>
      </div>

      <!-- Effect Text -->
      <div id="effect-text" class="effect-text"></div>
      <div id="damage-number" class="damage-number"></div>
      <!-- Correct Answer Overlay (shown on wrong answer) -->
      <div id="correct-answer-overlay" class="correct-answer-overlay"></div>

      <!-- Enemy Side -->
      <div class="fighter-col">
        <div class="hp-bar-container">
          <div id="enemy-hp-bar" class="hp-bar enemy-bar"></div>
        </div>
        <span id="enemy-hp-text" class="hp-text">60/60</span>
        <div id="enemy-char" class="character enemy-character">
          <!-- Rendered by JS -->
        </div>
        <span class="fighter-label" id="enemy-label">SLIME Lv.1</span>
      </div>
    </div>

    <!-- Status Area -->
    <div id="status-area">
      <div class="status-item">
        <span class="status-label">STAGE</span>
        <span id="stage-num" class="status-value">1</span>
      </div>
      <div class="status-item">
        <span class="status-label">COMBO</span>
        <span id="combo-num" class="status-value">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">TIME</span>
        <span id="time-num" class="status-value">15.0</span>
      </div>
      <div class="status-item special-status" id="special-status">
        <span class="status-label">SPECIAL</span>
        <span id="special-num" class="status-value">0/3</span>
      </div>
    </div>

    <!-- Timer Bar -->
    <div id="timer-bar-container">
      <div id="timer-bar"></div>
    </div>

    <!-- Question Area -->
    <div id="question-area">
      <div id="question-text" class="question-text">3 &times; 7 = ?</div>
    </div>

    <!-- Input Area -->
    <div id="input-area">
      <form id="answer-form" autocomplete="off" action="javascript:void(0);">
        <input type="text" inputmode="numeric" pattern="[0-9]*"
               id="answer-input" readonly
               placeholder="?" autocomplete="off"
               autocorrect="off" autocapitalize="off" spellcheck="false"
               data-form-type="other" data-lpignore="true"
               enterkeyhint="done" maxlength="3">
      </form>
      <button id="submit-btn" class="block-btn">OK</button>
      <button id="special-btn" class="block-btn special-btn" disabled>
        SPECIAL (SPACE)
      </button>
      <!-- Item Collection -->
      <div id="item-collection" class="item-collection"></div>
    </div>
  </div>

  <!-- ===== Game Clear Screen ===== -->
  <div id="clear-screen" class="screen center-screen hidden">
    <div class="clear-content">
      <div class="clear-dragon-icon">🐉</div>
      <h2 class="clear-title">GAME CLEAR!</h2>
      <p class="clear-subtitle">エンダードラゴン討伐！</p>
      <div id="clear-stats" class="result-stats"></div>
      <button id="clear-retry-btn" class="block-btn big-btn clear-btn">PLAY AGAIN</button>
    </div>
  </div>

  <!-- ===== Game Over Screen ===== -->
  <div id="gameover-screen" class="screen center-screen hidden">
    <div class="gameover-content">
      <h2 class="gameover-title">GAME OVER</h2>
      <div id="result-stats" class="result-stats"></div>
      <button id="retry-btn" class="block-btn big-btn">RETRY</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
